[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-gcal-bridge"
version = "0.1.0"
description = "One-way Feishu CalDAV to a personal Google Calendar"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "caldav>=3.3,<4",
  "icalendar>=6.3,<7",
  "recurring-ical-events>=3.8,<4",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fgbridge = "fgbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fgbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

